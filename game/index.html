<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#151a1e">
<title>Дальнобой по России</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151a1e;color:#f1f2f3;font-family:Arial,Helvetica,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
*{box-sizing:border-box}[hidden]{display:none!important}
#frame{position:fixed;inset:0;overflow:hidden}
#loading{--accent:#f0ba34;position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:radial-gradient(120% 90% at 70% 10%,#26323b 0,#151a1e 70%);transition:opacity .5s ease}
#loading.out{opacity:0;pointer-events:none}
.lcard{position:relative;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:24px 36px;width:min(900px,100%);padding:40px;background:#1f262cdd;border:1px solid #ffffff14;border-radius:8px;box-shadow:0 18px 70px #0006}
.lcard:before{content:'';position:absolute;top:-1px;left:40px;width:72px;height:3px;background:var(--accent)}
#ltitle{margin:0;font-size:clamp(30px,4.2vw,50px);font-weight:800;line-height:1.05;letter-spacing:-1px;text-transform:uppercase}
#lsub{margin:10px 0 0;color:#aeb9c2;font-size:14px;line-height:1.5}
.lscene{width:100%;height:auto;max-height:200px}
.lscene .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
.lscene .dash{animation:dash 0.9s linear infinite}
.lstatus{grid-column:1/-1;border-top:1px solid #ffffff12;padding-top:22px}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:10px}
#lstage{margin:0;font-size:15px;font-weight:700}
#lpct{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.lbar{height:7px;border-radius:4px;background:#39444d;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d99a1e,var(--accent));transition:width .3s ease}
#ltip{margin:14px 0 0;min-height:40px;color:#b7c1c9;font-size:13px;line-height:1.55}
#lretry{display:block;min-width:170px;min-height:44px;margin-top:14px;padding:10px 18px;border:0;border-radius:4px;background:var(--accent);color:#1d2328;font:700 14px Arial,sans-serif;cursor:pointer}
#loading[data-state=error] #lstage{color:#ff9a7d}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-76}}
@media (max-width:720px){.lcard{grid-template-columns:1fr;gap:16px;padding:24px}.lcard:before{left:24px}.lscene{max-height:120px}#ltitle{font-size:32px}}
@media (max-height:500px) and (orientation:landscape){.lcard{padding:20px 26px;gap:12px 24px}.lscene{max-height:110px}#ltitle{font-size:30px}.lstatus{padding-top:14px}#ltip{min-height:0}}
@media (prefers-reduced-motion:reduce){.lscene *{animation:none!important}}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="frame">
<section id="loading" aria-busy="true">
<div class="lcard">
<div><h1 id="ltitle">Дальнобой по России</h1><p id="lsub">59 городов, трассы М и Р, Волга, Ока и Дон</p></div>
<svg class="lscene" viewBox="0 0 440 240" fill="none" aria-hidden="true">
<path d="M0 125h38V98h24v27h17V73h40v52h19v-16h37v16h30V85h20v40h29V66h38v59h23v-26h40v26h25V90h30v35h35" stroke="#4d5b65" stroke-width="2"/>
<path d="M0 159h440M0 223h440" stroke="#58626a" stroke-width="2"/>
<path class="dash" d="M0 207h440" stroke="#e3ba55" stroke-width="3" stroke-dasharray="45 31"/>
<path d="M70 88h224v89H70z" fill="#c2cacf"/><path d="M70 88h224v10H70z" fill="#e0e4e5"/><path d="M71 149h222v11H71z" fill="#e2ae33"/>
<path d="M84 106v35m14-35v35m14-35v35m14-35v35m14-35v35m14-35v35m14-35v35m14-35v35m14-35v35m14-35v35m14-35v35m14-35v35m14-35v35m14-35v35" stroke="#a4afb8" stroke-width="2"/>
<path d="M65 176h267v12H65z" fill="#68757f"/>
<path d="M308 112h43l31 33v43h-81v-63a13 13 0 0 1 7-13Z" fill="#f0ba34"/><path d="M317 120h30l22 25h-52z" fill="#34444f"/>
<path d="M351 130v57m-11-27h-14" stroke="#977424" stroke-width="2"/><path d="M379 153h-12v6h12z" fill="#faf0c7"/>
<g class="wheel"><circle cx="99" cy="180" r="17" fill="#151a1e" stroke="#5d6a73" stroke-width="3"/><path d="M99 168v24M87 180h24" stroke="#87949d" stroke-width="3"/></g>
<g class="wheel"><circle cx="136" cy="180" r="17" fill="#151a1e" stroke="#5d6a73" stroke-width="3"/><path d="M136 168v24M124 180h24" stroke="#87949d" stroke-width="3"/></g>
<g class="wheel"><circle cx="272" cy="180" r="17" fill="#151a1e" stroke="#5d6a73" stroke-width="3"/><path d="M272 168v24M260 180h24" stroke="#87949d" stroke-width="3"/></g>
<g class="wheel"><circle cx="325" cy="180" r="17" fill="#151a1e" stroke="#5d6a73" stroke-width="3"/><path d="M325 168v24M313 180h24" stroke="#87949d" stroke-width="3"/></g>
</svg>
<div class="lstatus">
<div class="lrow"><p id="lstage" role="status" aria-live="polite">Подготовка к рейсу</p><span id="lpct">0%</span></div>
<div class="lbar"><i id="lbar"></i></div>
<p id="ltip"></p>
<button id="lretry" type="button" hidden>Повторить загрузку</button>
</div>
</div>
</section>
</main>
<script>
// The loading screen must react even if the game bundle fails to load.
(function () {
  var en = false;
  try { en = (JSON.parse(localStorage.getItem('dalnoboy-rossii-save-v2')) || {}).lang === 'en'; } catch (e) {}
  if (!en && !/^ru|^be|^kk|^uk|^uz/i.test(navigator.language || 'ru') && !localStorage.getItem('dalnoboy-rossii-save-v2')) en = true;
  if (en) {
    document.documentElement.lang = 'en';
    document.title = 'Trucking Across Russia';
    document.getElementById('ltitle').textContent = 'Trucking Across Russia';
    document.getElementById('lsub').textContent = '59 cities, M and R highways, the Volga, Oka and Don';
    document.getElementById('lstage').textContent = 'Preparing your trip';
    document.getElementById('lretry').textContent = 'Try again';
  }
  window.__bootFail = function () {
    var l = document.getElementById('loading');
    if (!l || l.dataset.state === 'error' || l.dataset.state === 'ready') return;
    l.dataset.state = 'error';
    document.getElementById('lstage').textContent = en ? 'Unable to load the game' : 'Не удалось загрузить игру';
    document.getElementById('ltip').textContent = en ? 'Check your connection and try again. Your progress is kept.' : 'Проверьте соединение и попробуйте ещё раз. Прогресс сохранится.';
    var b = document.getElementById('lretry');
    b.hidden = false;
    b.onclick = function () { location.reload(); };
  };
  window.addEventListener('error', function (e) { if (e.filename && /app\.js/.test(e.filename)) window.__bootFail(); });
})();
</script>
<script src="/sdk.js"></script>
<script type="module" src="app.js" onerror="window.__bootFail()"></script>
</body>
</html>
